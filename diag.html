<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>בדיקת סנכרון</title>
</head>
<body style="font-family:system-ui,sans-serif;padding:24px;font-size:18px;background:#F4F7FB;">
<h2>בדיקה 1: JSONP (script tag) — השיטה הנוכחית</h2>
<div id="status1" style="padding:16px;border-radius:10px;background:#E4EAF1;font-weight:700;">בודק...</div>
<div id="detail1" style="margin-top:10px;white-space:pre-wrap;font-family:monospace;font-size:12px;color:#444;"></div>

<h2 style="margin-top:32px;">בדיקה 2: fetch() — שיטה חלופית</h2>
<div id="status2" style="padding:16px;border-radius:10px;background:#E4EAF1;font-weight:700;">בודק...</div>
<div id="detail2" style="margin-top:10px;white-space:pre-wrap;font-family:monospace;font-size:12px;color:#444;"></div>

<h2 style="margin-top:32px;">בדיקה 3: iframe + postMessage — מועמד חדש (דורש redeploy)</h2>
<div id="status3" style="padding:16px;border-radius:10px;background:#E4EAF1;font-weight:700;">בודק...</div>
<div id="detail3" style="margin-top:10px;white-space:pre-wrap;font-family:monospace;font-size:12px;color:#444;"></div>

<script>
var url = 'https://script.google.com/macros/s/AKfycby4vjW_P4KzHwKnuLIwFSO3B7n9oofY9A-5UAJbpPOLlAELvmEpSLfN9bKGuW7g2nv0-w/exec';

// בדיקה 1: JSONP
(function () {
  var statusEl = document.getElementById('status1');
  var detailEl = document.getElementById('detail1');
  var cbName = 'diagCb' + Date.now();
  var done = false;

  window[cbName] = function (res) {
    done = true;
    statusEl.style.background = '#C8F7C8';
    statusEl.textContent = '✅ הצליח (JSONP עובד).';
    detailEl.textContent = JSON.stringify(res, null, 2);
  };

  var script = document.createElement('script');
  script.onerror = function () {
    if (!done) {
      statusEl.style.background = '#F7C8C8';
      statusEl.textContent = '❌ שגיאה בטעינת הסקריפט (onerror).';
    }
  };
  script.src = url + '?callback=' + cbName + '&password=diagnostic-test&_=' + Date.now();
  document.body.appendChild(script);

  setTimeout(function () {
    if (!done) {
      statusEl.style.background = '#F7C8C8';
      statusEl.textContent = '⏱️ טיים-אאוט — אין תשובה בכלל.';
    }
  }, 10000);
})();

// בדיקה 2: fetch
(function () {
  var statusEl = document.getElementById('status2');
  var detailEl = document.getElementById('detail2');
  var ctrl = new AbortController();
  var timer = setTimeout(function () { ctrl.abort(); }, 10000);

  fetch(url + '?password=diagnostic-test&_=' + Date.now(), { signal: ctrl.signal })
    .then(function (r) { return r.text().then(function (t) { return { status: r.status, ok: r.ok, text: t }; }); })
    .then(function (info) {
      clearTimeout(timer);
      statusEl.style.background = '#C8F7C8';
      statusEl.textContent = '✅ fetch הצליח (HTTP ' + info.status + ').';
      detailEl.textContent = info.text.slice(0, 500);
    })
    .catch(function (err) {
      clearTimeout(timer);
      statusEl.style.background = '#F7C8C8';
      statusEl.textContent = '❌ fetch נכשל: ' + (err && err.message ? err.message : String(err));
    });
})();

// בדיקה 3: iframe + postMessage
(function () {
  var statusEl = document.getElementById('status3');
  var detailEl = document.getElementById('detail3');
  var done = false;

  function onMessage(ev) {
    if (done) return;
    var parsed;
    try { parsed = JSON.parse(ev.data); } catch (e) { return; }
    if (!parsed || typeof parsed !== 'object' || !parsed.status) return;
    done = true;
    window.removeEventListener('message', onMessage);
    statusEl.style.background = '#C8F7C8';
    statusEl.textContent = '✅ הצליח (iframe + postMessage עובד)!';
    detailEl.textContent = JSON.stringify(parsed, null, 2);
    if (iframe.parentNode) iframe.parentNode.removeChild(iframe);
  }
  window.addEventListener('message', onMessage);

  var iframe = document.createElement('iframe');
  iframe.style.display = 'none';
  iframe.src = url + '?mode=postmessage&password=diagnostic-test&_=' + Date.now();
  document.body.appendChild(iframe);

  setTimeout(function () {
    if (!done) {
      statusEl.style.background = '#F7C8C8';
      statusEl.textContent = '⏱️ טיים-אאוט — אין תשובה. (יתכן שעדיין לא עשית redeploy לקוד המעודכן)';
    }
  }, 10000);
})();
</script>
</body>
</html>
