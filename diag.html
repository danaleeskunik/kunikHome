<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>בדיקת סנכרון</title>
</head>
<body style="font-family:system-ui,sans-serif;padding:24px;font-size:18px;background:#F4F7FB;">
<h2>בדיקת חיבור לגיליון</h2>
<div id="status" style="padding:16px;border-radius:10px;background:#E4EAF1;font-weight:700;">בודק...</div>
<div id="detail" style="margin-top:14px;white-space:pre-wrap;font-family:monospace;font-size:13px;color:#444;"></div>
<script>
var statusEl = document.getElementById('status');
var detailEl = document.getElementById('detail');
var url = 'https://script.google.com/macros/s/AKfycby4vjW_P4KzHwKnuLIwFSO3B7n9oofY9A-5UAJbpPOLlAELvmEpSLfN9bKGuW7g2nv0-w/exec';
var cbName = 'diagCb' + Date.now();
var done = false;

window[cbName] = function (res) {
  done = true;
  statusEl.style.background = '#C8F7C8';
  statusEl.textContent = '✅ הצליח! קיבלתי תשובה מהשרת (JSONP עובד).';
  detailEl.textContent = JSON.stringify(res, null, 2);
};

var script = document.createElement('script');
script.onerror = function () {
  if (!done) {
    statusEl.style.background = '#F7C8C8';
    statusEl.textContent = '❌ שגיאה בטעינת הסקריפט (onerror) — החסימה קורית כאן.';
  }
};
script.src = url + '?callback=' + cbName + '&password=diagnostic-test&_=' + Date.now();
document.body.appendChild(script);

setTimeout(function () {
  if (!done) {
    statusEl.style.background = '#F7C8C8';
    statusEl.textContent = '⏱️ טיים-אאוט אחרי 10 שניות — אין תשובה בכלל (לא onerror ולא הצלחה). זו כנראה חסימה שקטה.';
  }
}, 10000);
</script>
</body>
</html>
